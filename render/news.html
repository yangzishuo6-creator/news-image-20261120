<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>The World on 20 November 2026</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1024px; height: 1024px; padding: 36px; color: #192923; background: #f1eee3; }
  header { height: 192px; position: relative; padding: 12px 6px; border-top: 6px solid #192923; }
  h1 { margin: 0; font: 700 37px Arial, sans-serif; letter-spacing: 5px; }
  h1 span { display: block; margin-top: 2px; font: 700 75px Georgia, serif; letter-spacing: -3px; }
  main { display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 179px; gap: 15px; }
  article { display: grid; grid-template-columns: 139px 1fr; align-items: center; gap: 15px; padding: 13px; background: #fffdf6; border: 1px solid #c5c9bb; }
  article svg { width: 139px; height: 139px; background: var(--wash); color: var(--ink); }
  .region { margin: 0 0 8px; color: #43544b; font: 700 19px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  h2 { margin: 0; font: 700 33px/1.04 "Barlow Condensed", "Liberation Sans Narrow", sans-serif; }
  h2 span { display: block; }
  .globe { position: absolute; top: 18px; right: 9px; width: 137px; height: 137px; color: #326254; }
</style>
<header>
  <h1>THE WORLD ON <span>20 NOVEMBER 2026</span></h1>
  <svg class="globe" viewBox="0 0 120 120" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="2.6">
      <circle cx="60" cy="60" r="49"/>
      <ellipse cx="60" cy="60" rx="25" ry="49"/>
      <path d="M60 11v98M11 60h98M21 31q39 20 78 0M21 89q39-20 78 0"/>
    </g>
  </svg>
</header>
<main></main>

  document.querySelector('main').innerHTML = panels.join('');
